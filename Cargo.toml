[package]
name = "chiviz"
version = "0.1.0"
edition = "2024"
authors = ["chiv"]
description = "Omarchy-Native Audio Visualizer for Kitty and Hyprland"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
crossbeam-channel = "0.5"
anyhow = "1.0"
thiserror = "2.0"
tempfile = "3.17"
rand = "0.9"
