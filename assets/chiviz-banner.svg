<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Spectrum Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="25%" stop-color="#4facfe"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1.0"/>
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Background Spectrum Bars -->
  <g fill="url(#barGrad)">
    <rect x="520" y="240" width="10" height="60" rx="2"/>
    <rect x="536" y="220" width="10" height="80" rx="2"/>
    <rect x="552" y="190" width="10" height="110" rx="2"/>
    <rect x="568" y="150" width="10" height="150" rx="2"/>
    <rect x="584" y="120" width="10" height="180" rx="2"/>
    <rect x="600" y="140" width="10" height="160" rx="2"/>
    <rect x="616" y="170" width="10" height="130" rx="2"/>
    <rect x="632" y="210" width="10" height="90" rx="2"/>
    <rect x="648" y="180" width="10" height="120" rx="2"/>
    <rect x="664" y="130" width="10" height="170" rx="2"/>
    <rect x="680" y="100" width="10" height="200" rx="2"/>
    <rect x="696" y="80" width="10" height="220" rx="2"/>
    <rect x="712" y="110" width="10" height="190" rx="2"/>
    <rect x="728" y="150" width="10" height="150" rx="2"/>
    <rect x="744" y="170" width="10" height="130" rx="2"/>
    <rect x="760" y="130" width="10" height="170" rx="2"/>
    <rect x="776" y="160" width="10" height="140" rx="2"/>
    <rect x="792" y="200" width="10" height="100" rx="2"/>
    <rect x="808" y="230" width="10" height="70" rx="2"/>
    <rect x="824" y="210" width="10" height="90" rx="2"/>
    <rect x="840" y="180" width="10" height="120" rx="2"/>
    <rect x="856" y="220" width="10" height="80" rx="2"/>
    <rect x="872" y="250" width="10" height="50" rx="2"/>
    <rect x="888" y="230" width="10" height="70" rx="2"/>
    <rect x="904" y="260" width="10" height="40" rx="2"/>
    <rect x="920" y="240" width="10" height="60" rx="2"/>
    <rect x="936" y="270" width="10" height="30" rx="2"/>
  </g>

  <!-- Glowing Peaks -->
  <g fill="#38bdf8">
    <rect x="520" y="234" width="10" height="2" rx="1"/>
    <rect x="536" y="212" width="10" height="2" rx="1"/>
    <rect x="552" y="180" width="10" height="2" rx="1"/>
    <rect x="568" y="138" width="10" height="2" rx="1"/>
    <rect x="584" y="108" width="10" height="2" rx="1"/>
    <rect x="600" y="128" width="10" height="2" rx="1"/>
    <rect x="616" y="158" width="10" height="2" rx="1"/>
    <rect x="632" y="198" width="10" height="2" rx="1"/>
    <rect x="648" y="168" width="10" height="2" rx="1"/>
    <rect x="664" y="118" width="10" height="2" rx="1"/>
    <rect x="680" y="88" width="10" height="2" rx="1"/>
    <rect x="696" y="68" width="10" height="2" rx="1"/>
    <rect x="712" y="98" width="10" height="2" rx="1"/>
    <rect x="728" y="138" width="10" height="2" rx="1"/>
    <rect x="744" y="158" width="10" height="2" rx="1"/>
    <rect x="760" y="118" width="10" height="2" rx="1"/>
    <rect x="776" y="148" width="10" height="2" rx="1"/>
    <rect x="792" y="188" width="10" height="2" rx="1"/>
    <rect x="808" y="218" width="10" height="2" rx="1"/>
    <rect x="824" y="198" width="10" height="2" rx="1"/>
    <rect x="840" y="168" width="10" height="2" rx="1"/>
    <rect x="856" y="208" width="10" height="2" rx="1"/>
    <rect x="872" y="238" width="10" height="2" rx="1"/>
  </g>

  <!-- Flowing Waveform Line -->
  <path d="M 460 270 Q 560 140 680 90 T 800 160 T 960 250 T 1120 180" 
        fill="none" stroke="url(#waveGrad)" stroke-width="4" filter="url(#neon)" opacity="0.85"/>
  <path d="M 460 270 Q 560 140 680 90 T 800 160 T 960 250 T 1120 180" 
        fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>

  <!-- Left Side: Brand & Identity -->
  <g transform="translate(80, 75)">
    <!-- Tagline pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10b981"/>
    <text x="28" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5">OMARCHY NATIVE PLUGIN</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#f8fafc" letter-spacing="-1">
      ⚡ chiviz
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1">
      High-Performance Audio Spectrum Visualizer
    </text>
    <text x="0" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      PipeWire Reactive · Kitty Terminal · Quickshell Bar Widget · Ratatui
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 185)">
      <!-- Badge 1: Rust -->
      <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="42" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f97316">🦀 Rust 2024</text>
      
      <!-- Badge 2: PipeWire -->
      <rect x="95" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="142" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🔊 PipeWire</text>
      
      <!-- Badge 3: Hyprland -->
      <rect x="200" y="0" width="95" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="247" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#00f2fe">🪟 Hyprland</text>

      <!-- Badge 4: Bar Widget -->
      <rect x="305" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
      <text x="357" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc">󰎈 Bar Plugin</text>
    </g>
  </g>
</svg>
